<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3DS-web</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  canvas { display: block; width: 100%; max-width: 800px; background: #000; image-rendering: pixelated; touch-action: none; }
  #keys { color: #999; font-size: 12px; }
  #log { height: 220px; overflow: auto; background: #000; padding: 8px; font: 12px/1.4 monospace; white-space: pre-wrap; }
  .row { margin: 12px 0; }
  #gfx { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  #gpu { color: #999; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="row">
    <label>ROM を選択（自分で吸い出した .3ds / .cia など）: <input type="file" id="rom" disabled></label>
    <span id="status">読み込み中…</span>
    <span id="speed"></span>
    <button id="copylog" type="button">エラーをコピー</button>
  </div>
  <div class="row" id="gfx">
    <label>描画 <select id="api">
      <option value="auto">自動</option>
      <option value="OpenGL">GPU（WebGL2）</option>
      <option value="Software">CPU（ソフトウェア描画）</option>
    </select></label>
    <label>解像度 <select id="scale">
      <option value="1">1 倍（400×240）</option>
      <option value="2">2 倍</option>
      <option value="3">3 倍</option>
      <option value="4">4 倍</option>
    </select></label>
    <span id="gpu"></span>
  </div>
  <canvas id="canvas" width="400" height="480"></canvas>
  <div class="row" id="keys">
    キー: A=X　B=Z　X=S　Y=A　L=Q　R=W　ZL=1　ZR=2　START=Enter　SELECT=Backspace　HOME=Esc　
    十字キー=T/F/G/H　スライドパッド=矢印　C スティック=I/J/K/L。下画面はクリック・タッチで操作。
    ゲームパッドも使えます。音はページを一度クリックするかキーを押すと鳴ります。
    セーブはこのブラウザに自動で保存されます（サイトのデータを消すと消えます）。
  </div>
  <div class="row" id="log"></div>
  <div class="row" id="keys">
    <a href="https://github.com/azahar-emu/azahar" style="color:inherit">Azahar</a> の非公式ブラウザ移植。Azahar・任天堂とは無関係です。
    GPL-3.0-or-later — <a href="https://github.com/kuroron000234/3ds-web" style="color:inherit">ソースコード</a>
  </div>
</main>
<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const romEl = document.getElementById('rom');

  let lastMessage = ''; // コアが画面表示用に出した直近のメッセージ（読み込み失敗の理由など）
  // ログは直近 LOG_MAX 行だけを持ち、画面への反映は 1 フレームに 1 回にまとめる。
  // エミュレーションスレッドの printf はメインスレッドの処理が終わるまで待たされるので、
  // ここが重いとゲームが遅くなる（以前は textContent に足し続け、長く遊ぶほど遅くなっていた）
  const LOG_MAX = 1000;
  const ERROR_RE = /\[MSG\]|error|critical|abort|exception|assert|unreachable|warning|失敗|異常/i;
  let logLines = [];
  const errorLines = []; // コピー用。古いエラー行が流れて消えないよう別に持つ（直近 200 行）
  let logDirty = false;
  function log(text) {
    if (text.startsWith('[DEBUG]')) return; // 旧ビルドはコアのデバッグログも流してくる
    if (text.startsWith('[MSG] ')) lastMessage = text.slice(6).trim();
    logLines.push(text);
    if (logLines.length > LOG_MAX * 2) logLines = logLines.slice(-LOG_MAX);
    if (ERROR_RE.test(text) && !/FetchVariable/.test(text)) {
      errorLines.push(text);
      if (errorLines.length > 200) errorLines.shift();
    }
    if (!logDirty) {
      logDirty = true;
      requestAnimationFrame(() => {
        logDirty = false;
        logEl.textContent = logLines.slice(-LOG_MAX).join('\n');
        logEl.scrollTop = logEl.scrollHeight;
      });
    }
  }
  window.logText = () => logLines.join('\n'); // テスト用

  // 不具合の報告用: ログからエラーに関係する行（と末尾の数行）だけを取り出してコピーする
  document.getElementById('copylog').addEventListener('click', async (ev) => {
    const lines = logLines.filter(l => l);
    const hits = errorLines;
    const text = ['状態: ' + statusEl.textContent, 'ROM: ' + (romEl.files[0] ? romEl.files[0].name.replace(/^.*(\.[^.]+)$/, '*$1') + ' ' + Math.round(romEl.files[0].size / 1048576) + 'MB' : 'なし'),
      '--- エラー行（最大 40）', ...[...new Set(hits)].slice(-40), '--- 末尾 10 行', ...lines.slice(-10)].join('\n');
    try { await navigator.clipboard.writeText(text); ev.target.textContent = 'コピーしました'; }
    catch { logEl.textContent = text; ev.target.textContent = '下の欄に絞り込みました'; }
  });

  if (!self.crossOriginIsolated) {
    log('警告: crossOriginIsolated が無効です。COOP/COEP ヘッダ付きで配信してください。');
  }

  // ---- セーブの保存: /azahar/save（仮想 SD・NAND）をブラウザの IndexedDB に残す ----
  // Emscripten のファイルシステムはメモリ上にあり、ページを閉じると消える。数秒おきに
  // 変わったファイルだけを IndexedDB へ書き、次に開いたときに起動前に戻す。
  // ファイルシステムはメインスレッドにあり、エミュレーションスレッドの読み書きもここで処理されるので、
  // この JS が動いている間にファイルが書きかけになることはない。
  const saves = (() => {
    const ROOT = '/azahar/save';
    let db = null;
    const known = new Map(); // パス → 'mtime:size'（IndexedDB にある版）
    const req = (r) => new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
    async function open() {
      if (db) return db;
      const r = indexedDB.open('3ds-web-saves', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'path' });
      return (db = await req(r));
    }
    const stamp = (st) => (st.mtime instanceof Date ? st.mtime.getTime() : Number(st.mtime)) + ':' + st.size;
    function walk(dir, out) {
      for (const name of Module.FS.readdir(dir)) {
        if (name === '.' || name === '..') continue;
        const path = dir + '/' + name;
        const st = Module.FS.stat(path);
        if (Module.FS.isDir(st.mode)) walk(path, out);
        else out.set(path, stamp(st));
      }
      return out;
    }
    async function restore() {
      const all = await req((await open()).transaction('files').objectStore('files').getAll());
      for (const f of all) {
        const dir = f.path.slice(0, f.path.lastIndexOf('/'));
        Module.FS.mkdirTree(dir);
        Module.FS.writeFile(f.path, f.data);
      }
      // 書き戻した時点の状態を基準にする（戻しただけのファイルを次の保存で書き直さない）
      for (const [path, st] of walk(ROOT, new Map())) known.set(path, st);
      if (all.length) log(`セーブを読み込みました（${all.length} ファイル）`);
    }
    let busy = false;
    async function flush() {
      if (busy || !Module.FS) return;
      busy = true;
      try {
        const now = walk(ROOT, new Map());
        const changed = [...now].filter(([p, st]) => known.get(p) !== st);
        const removed = [...known.keys()].filter((p) => !now.has(p));
        if (!changed.length && !removed.length) return;
        const tx = (await open()).transaction('files', 'readwrite');
        const store = tx.objectStore('files');
        for (const [path] of changed) store.put({ path, data: Module.FS.readFile(path) });
        for (const path of removed) store.delete(path);
        await new Promise((ok, ng) => { tx.oncomplete = ok; tx.onerror = () => ng(tx.error); tx.onabort = () => ng(tx.error); });
        for (const [path, st] of changed) known.set(path, st);
        for (const path of removed) known.delete(path);
      } catch (e) {
        log('セーブを保存できません: ' + e);
      } finally {
        busy = false;
      }
    }
    return { restore, flush };
  })();
  setInterval(() => { if (gameStarted) saves.flush(); }, 3000);
  addEventListener('visibilitychange', () => { if (document.hidden && gameStarted) saves.flush(); });
  addEventListener('pagehide', () => { if (gameStarted) saves.flush(); });

  var Module = {
    canvas: document.getElementById('canvas'),
    print: log,
    printErr: log,
    preRun: [() => {
      for (const dir of ['/azahar', '/azahar/system', '/azahar/save', '/roms']) {
        Module.FS.mkdir(dir);
      }
      // 前回までのセーブを戻してから起動する
      Module.addRunDependency('restore-saves');
      saves.restore().catch((e) => log('セーブを読み込めません: ' + e))
        .finally(() => Module.removeRunDependency('restore-saves'));
    }],
    onRuntimeInitialized: () => {
      statusEl.textContent = '準備完了';
      romEl.disabled = false;
      inputReady();
      window.__ready = true;
    },
    onAbort: (what) => { statusEl.textContent = '異常終了: ' + what; },
  };

  // ページ側の例外もログ欄に出す（ROM が大きすぎてメモリに載らない場合など）
  addEventListener('error', (e) => log('JS error: ' + (e.error && e.error.stack || e.message)));
  addEventListener('unhandledrejection', (e) => {
    log('JS error: ' + (e.reason && e.reason.stack || e.reason));
    if (statusEl.textContent.startsWith('読み込み中')) statusEl.textContent = '読み込み失敗（ページ側のエラー）';
  });

  // ROM はメモリに載せない。File を ROM 読み込みスレッドへ渡し、コアが必要な範囲だけ読む
  // （frontend/main.cpp の VFS）。旧ビルドでは従来どおり丸ごと仮想ファイルに書く。
  const romChannel = new BroadcastChannel('3ds-web-rom');
  let romId = 0;
  async function mountRom(path, file) {
    if (!Module._web_mount_rom) {
      Module.FS.writeFile(path, new Uint8Array(await file.arrayBuffer()), { canOwn: true });
      return;
    }
    const id = ++romId;
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => { romChannel.removeEventListener('message', onAck); reject(new Error('ROM 読み込みスレッドが応答しません')); }, 10000);
      const onAck = (e) => {
        if (e.data && e.data.ack === id) { clearTimeout(timer); romChannel.removeEventListener('message', onAck); resolve(); }
      };
      romChannel.addEventListener('message', onAck);
      romChannel.postMessage({ id, file });
    });
    Module.ccall('web_mount_rom', null, ['string', 'number', 'number'], [path, id, file.size]);
  }
  window.mountRom = mountRom;

  // ---- 描画方式と解像度 ----
  // ブラウザの WebGL が GPU で動いているかを調べる。GPU が無い（または使えない）端末では
  // ブラウザが CPU で WebGL を代行する（SwiftShader・llvmpipe など）ので、それを見分ける。
  function detectGpu() {
    const gl = document.createElement('canvas').getContext('webgl2', { powerPreference: 'high-performance' });
    if (!gl) return { name: 'WebGL2 非対応', hardware: false, webgl2: false };
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const name = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    // CPU 代行のときは「性能に大きな問題がある」扱いになり、この指定で作れない
    const strict = document.createElement('canvas').getContext('webgl2', { failIfMajorPerformanceCaveat: true });
    strict?.getExtension('WEBGL_lose_context')?.loseContext();
    const software = !strict || /swiftshader|llvmpipe|softpipe|lavapipe|software|basic render/i.test(name);
    return { name, hardware: !software, webgl2: true };
  }
  const gpu = detectGpu();
  const apiEl = document.getElementById('api');
  const scaleEl = document.getElementById('scale');
  const gpuEl = document.getElementById('gpu');
  const store = {
    get(k) { try { return localStorage.getItem('3ds-web.' + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('3ds-web.' + k, v); } catch {} },
  };
  apiEl.value = store.get('api') || 'auto';
  scaleEl.value = store.get('scale') || '1';
  if (!apiEl.value) apiEl.value = 'auto';
  if (!scaleEl.value) scaleEl.value = '1';
  if (!gpu.webgl2) apiEl.querySelector('option[value=OpenGL]').disabled = true;
  // 自動: WebGL2 があれば常にそれを使う。CPU 代行の WebGL でもソフトウェア描画より速い
  // （SwiftShader での実測: WebGL2 は実機比 35%、ソフトウェア描画は 4%）
  const chosenApi = () => apiEl.value !== 'auto' && !(apiEl.value === 'OpenGL' && !gpu.webgl2)
    ? apiEl.value : (gpu.webgl2 ? 'OpenGL' : 'Software');
  // 解像度を上げられるのは本物の GPU で WebGL2 を使うときだけ（CPU 代行では遅くなるだけ。
  // SwiftShader で 2 倍にすると 35% → 14%）。ソフトウェア描画は常に等倍
  const canScale = () => chosenApi() === 'OpenGL' && gpu.hardware;
  let gameStarted = false;
  function updateGfxUi() {
    const api = chosenApi();
    scaleEl.disabled = !canScale();
    gpuEl.textContent = (gpu.hardware ? 'GPU: ' : 'GPU なし（CPU で代行）: ') + gpu.name +
      (!gpu.hardware && api === 'OpenGL' ? ' → 解像度は 1 倍に固定' : '') +
      (!gpu.webgl2 ? ' → CPU で描画' : '') +
      (gameStarted ? '（変更はページを再読み込みすると反映）' : '');
  }
  for (const el of [apiEl, scaleEl]) {
    el.addEventListener('change', () => { store.set(el.id, el.value); updateGfxUi(); });
  }
  updateGfxUi();
  log('WebGL: ' + gpu.name + (gpu.hardware ? '' : '（GPU ではなく CPU で動作）'));
  // ROM の読み込み直前に呼ぶ（コアは読み込み時にだけ設定を読む）
  function applyGraphics() {
    const api = chosenApi();
    const scale = canScale() ? scaleEl.value : '1';
    Module.ccall('web_set_option', null, ['string', 'string'], ['citra_graphics_api', api]);
    Module.ccall('web_set_option', null, ['string', 'string'], ['citra_resolution_factor', scale]);
    log(`描画: ${api === 'OpenGL' ? 'GPU（WebGL2）' : 'CPU（ソフトウェア）'}、解像度 ${scale} 倍`);
    gameStarted = true;
    updateGfxUi();
  }

  // ---- CIA: 中のメインのコンテンツ（NCCH）だけを取り出して起動する ----
  // Azahar は CIA を本体へのインストール用として扱い、直接は起動できない。インストールは中身を
  // まるごと仮想 SD（メモリ）へ書くので大きなソフトは載らない。そこで CIA の中の
  // コンテンツ 0（ゲーム本体の NCCH）の範囲を File の slice として渡し、.cxi と同じく必要な分だけ読む。
  // 更新データ・DLC は含まない。CIA 自体が暗号化されたもの（タイトル鍵の暗号）は扱わない。
  async function ciaMainContent(file) {
    const read = async (off, len) => new DataView(await file.slice(off, off + len).arrayBuffer());
    const align = (n) => Math.ceil(n / 64) * 64;
    const h = await read(0, 0x2020);
    if (h.byteLength < 0x2020 || h.getUint32(0, true) !== 0x2020) throw new Error('CIA の形式ではありません（圧縮された .zcia には未対応）');
    const certSize = h.getUint32(0x08, true), ticketSize = h.getUint32(0x0C, true), tmdSize = h.getUint32(0x10, true);
    const tmdOff = align(0x2020) + align(certSize) + align(ticketSize);
    const contentOff = tmdOff + align(tmdSize);
    const tmd = await read(tmdOff, tmdSize);
    const SIG = { 0x10000: 0x240, 0x10001: 0x140, 0x10002: 0x80, 0x10003: 0x240, 0x10004: 0x140, 0x10005: 0x80 };
    const sigLen = SIG[tmd.getUint32(0, false)];
    if (!sigLen) throw new Error('CIA の TMD を読めません');
    const count = tmd.getUint16(sigLen + 0x9E, false);
    const present = (i) => (h.getUint8(0x20 + (i >> 3)) & (0x80 >> (i & 7))) !== 0;
    let off = contentOff;
    for (let r = 0; r < count; r++) {
      const rec = sigLen + 0xC4 + 0x900 + r * 0x30;
      const index = tmd.getUint16(rec + 4, false), type = tmd.getUint16(rec + 6, false);
      const size = Number(tmd.getBigUint64(rec + 8, false));
      if (!present(index)) continue;
      if (index === 0) {
        const magic = new TextDecoder().decode(new Uint8Array((await read(off + 0x100, 4)).buffer));
        if ((type & 1) || magic !== 'NCCH') {
          throw new Error('暗号化された CIA は読めません（GodMode9 などで復号した CIA か .3ds を使ってください）');
        }
        log(`CIA: コンテンツ 0（${(size / 1048576).toFixed(1)}MB）を起動します。更新データ・DLC は含まれません`);
        return file.slice(off, off + size);
      }
      off += size;
    }
    throw new Error('CIA にゲーム本体（コンテンツ 0）が入っていません（更新データや DLC の CIA は単体では起動できません）');
  }

  romEl.addEventListener('change', async () => {
    const file = romEl.files[0];
    if (!file) return;
    statusEl.textContent = '読み込み中: ' + file.name;
    lastMessage = '';
    // 本体の言語をブラウザの言語に合わせる（既定は英語。多言語対応のゲームの表示に効く）
    const LANGS = { ja: 'Japanese', fr: 'French', es: 'Spanish', de: 'German', it: 'Italian', nl: 'Dutch', pt: 'Portuguese', ru: 'Russian', ko: 'Korean', zh: 'Traditional Chinese' };
    const lang = LANGS[(navigator.language || 'en').slice(0, 2)];
    if (lang) Module.ccall('web_set_option', null, ['string', 'string'], ['citra_language_value', lang]);
    let rom = file, path = '/roms/' + file.name;
    if (/\.cia$/i.test(file.name)) {
      try { rom = await ciaMainContent(file); }
      catch (e) { statusEl.textContent = '読み込み失敗: ' + e.message; log('CIA: ' + e.message); return; }
      path = path.replace(/\.cia$/i, '.cxi');
    }
    applyGraphics();
    await mountRom(path, rom);
    // 読み込みはエミュレーションスレッドで進む。メインスレッドは止めずに結果を待つ
    const ok = await (async (path) => {
      const started = Module.ccall('web_load_game', 'boolean', ['string'], [path]);
      if (!Module._web_load_state) return started; // 旧ビルドは同期で結果を返す
      if (!started) return false;
      for (;;) {
        const s = Module._web_load_state();
        if (s >= 2) return s === 2;
        await new Promise(r => setTimeout(r, 50));
      }
    })(path);
    statusEl.textContent = ok ? '実行中: ' + file.name : '読み込み失敗' + (lastMessage ? ': ' + lastMessage : '');
  });

  // ---- 入力: 共有メモリ（frontend/main.cpp の input_state）へ書く ----
  // ビット番号は RETRO_DEVICE_ID_JOYPAD_*（B=0 Y=1 SELECT=2 START=3 UP=4 DOWN=5 LEFT=6 RIGHT=7
  // A=8 X=9 L=10 R=11 ZL=12 ZR=13 HOME=14 R3=15）
  const KEY_BUTTONS = {
    KeyX: 8, KeyZ: 0, KeyS: 9, KeyA: 1, KeyQ: 10, KeyW: 11, Digit1: 12, Digit2: 13,
    Enter: 3, Backspace: 2, ShiftRight: 2, Escape: 14,
    KeyT: 4, KeyG: 5, KeyF: 6, KeyH: 7,
  };
  // [スティック番号, 軸, 向き]
  const KEY_AXES = {
    ArrowLeft: [0, 0, -1], ArrowRight: [0, 0, 1], ArrowUp: [0, 1, -1], ArrowDown: [0, 1, 1],
    KeyJ: [1, 0, -1], KeyL: [1, 0, 1], KeyI: [1, 1, -1], KeyK: [1, 1, 1],
  };
  // 標準配置のゲームパッド → 3DS（位置で合わせる: 下=B 右=A 左=Y 上=X）
  const PAD_BUTTONS = [0, 8, 1, 9, 10, 11, 12, 13, 2, 3, -1, 15, 4, 5, 6, 7, 14];
  const input = { view: null, keys: new Set(), pad: 0, padAxes: [0, 0, 0, 0] };

  function writeInput() {
    const v = input.view;
    if (!v) return;
    let buttons = input.pad;
    const axes = input.padAxes.slice();
    const keyAxes = [0, 0, 0, 0];
    for (const code of input.keys) {
      if (code in KEY_BUTTONS) buttons |= 1 << KEY_BUTTONS[code];
      const a = KEY_AXES[code];
      if (a) keyAxes[a[0] * 2 + a[1]] += a[2];
    }
    Atomics.store(v, 0, buttons);
    for (let i = 0; i < 4; i++) {
      const k = Math.max(-1, Math.min(1, keyAxes[i]));
      const value = Math.abs(k) > Math.abs(axes[i]) ? k : axes[i];
      Atomics.store(v, 1 + i, Math.round(value * 32767));
    }
  }

  function inputReady() {
    input.view = new Int32Array(Module.HEAP32.buffer, Module.ccall('web_input_ptr', 'number', [], []), 8);
    writeInput();
  }

  function isTyping(e) { return e.target instanceof HTMLInputElement; }
  addEventListener('keydown', (e) => {
    if (isTyping(e) || !(e.code in KEY_BUTTONS || e.code in KEY_AXES)) return;
    e.preventDefault();
    input.keys.add(e.code);
    writeInput();
  });
  addEventListener('keyup', (e) => {
    if (input.keys.delete(e.code)) writeInput();
  });
  addEventListener('blur', () => { input.keys.clear(); writeInput(); });

  // 下画面のタッチ: キャンバス全体を -32767..32767 に写す（どこが下画面かはコアが判断する）
  const canvasEl = document.getElementById('canvas');
  function setPointer(e, pressed) {
    const v = input.view;
    if (!v) return;
    const r = canvasEl.getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
    const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));
    Atomics.store(v, 5, Math.round(nx * 32767));
    Atomics.store(v, 6, Math.round(ny * 32767));
    if (pressed !== undefined) Atomics.store(v, 7, pressed ? 1 : 0);
  }
  canvasEl.addEventListener('pointerdown', (e) => {
    canvasEl.setPointerCapture(e.pointerId);
    setPointer(e, true);
    e.preventDefault();
  });
  canvasEl.addEventListener('pointermove', (e) => { if (e.buttons) setPointer(e); });
  for (const type of ['pointerup', 'pointercancel']) {
    canvasEl.addEventListener(type, (e) => setPointer(e, false));
  }

  function pollGamepads() {
    let pad = 0;
    const axes = [0, 0, 0, 0];
    for (const gp of navigator.getGamepads ? navigator.getGamepads() : []) {
      if (!gp || gp.mapping !== 'standard') continue;
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_BUTTONS[i] >= 0) pad |= 1 << PAD_BUTTONS[i]; });
      for (let i = 0; i < 4 && i < gp.axes.length; i++) {
        const x = gp.axes[i];
        if (Math.abs(x) > 0.15 && Math.abs(x) > Math.abs(axes[i])) axes[i] = x;
      }
    }
    if (pad !== input.pad || axes.some((x, i) => x !== input.padAxes[i])) {
      input.pad = pad;
      input.padAxes = axes;
      writeInput();
    }
  }

  // ---- 音声: 共有メモリのリングバッファ（frontend/main.cpp の AudioRing）を AudioWorklet で再生 ----
  const WORKLET = `
  class RingPlayer extends AudioWorkletProcessor {
    constructor() {
      super();
      this.primed = false;
      this.port.onmessage = (e) => {
        const { buffer, base } = e.data;
        this.hdr = new Uint32Array(buffer, base, 8);
        this.cap = this.hdr[2];
        this.pcm = new Int16Array(buffer, base + 32, this.cap * 2);
      };
    }
    process(inputs, outputs) {
      const out = outputs[0];
      const L = out[0], R = out[1] || out[0];
      if (!this.hdr) return true;
      const cap = this.cap, pcm = this.pcm;
      const w = Atomics.load(this.hdr, 0);
      let r = Atomics.load(this.hdr, 1);
      let avail = (w - r) >>> 0;
      // 溜まりすぎたら古い分を捨てて遅延を抑える
      if (avail > 4096) { r = (w - 2048) >>> 0; avail = 2048; }
      // 途切れた後は少し溜まるまで待つ（ぶつぶつ切れるのを減らす）
      if (!this.primed && avail < 1024) return true;
      this.primed = true;
      const n = Math.min(avail, L.length);
      for (let i = 0; i < n; i++) {
        const p = ((r + i) % cap) * 2;
        L[i] = pcm[p] / 32768;
        R[i] = pcm[p + 1] / 32768;
      }
      if (n < L.length) this.primed = false;
      Atomics.store(this.hdr, 1, (r + n) >>> 0);
      return true;
    }
  }
  registerProcessor('ring-player', RingPlayer);`;
  let audio = null;
  async function startAudio() {
    if (audio || !input.view) return;
    const base = Module.ccall('web_audio_ptr', 'number', [], []);
    const rate = new Uint32Array(Module.HEAP32.buffer, base, 8)[4] || 32728;
    audio = new AudioContext({ sampleRate: rate, latencyHint: 'interactive' });
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }));
    await audio.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(audio, 'ring-player', { outputChannelCount: [2] });
    node.port.postMessage({ buffer: Module.HEAP32.buffer, base });
    node.connect(audio.destination);
    await audio.resume();
  }
  for (const type of ['pointerdown', 'keydown']) {
    addEventListener(type, () => { startAudio().catch((e) => log('音声を開始できません: ' + e)); }, true);
  }

  // ---- 表示の更新とゲームパッドの読み取り（メインスレッドは軽い処理だけ）----
  const speedEl = document.getElementById('speed');
  let lastStats = 0;
  function onFrame(t) {
    if (input.view) pollGamepads();
    if (input.view && t - lastStats > 500) {
      lastStats = t;
      const speed = Module.ccall('web_get_speed', 'number', [], []);
      const busy = Module.ccall('web_get_busy', 'number', [], []);
      if (speed > 0) speedEl.textContent = `速度 ${speed.toFixed(0)}%（処理 ${busy.toFixed(0)}%）`;
    }
    requestAnimationFrame(onFrame);
  }
  requestAnimationFrame(onFrame);
</script>
<script src="azahar_web.js"></script>
</body>
</html>
